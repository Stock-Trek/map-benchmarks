name: Deploy static content to Pages

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  pull-requests: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          identity-id: "c603d49b-292c-42ae-b838-52e03e3c3a84"
          project-slug: "agents"
          env-slug: "dev"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update dependencies
        run: cargo update

      - name: Sanity check tests
        run: cargo test

      - name: Run benchmarks
        run: cargo bench

      - name: Copy redirect
        run: cp redirect.html target/criterion/index.html

      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './target/criterion'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Set up DeepSeek via pi
        uses: ./.github/actions/set-up-deepseek-via-pi
        env:
          DEEPSEEK_API_KEY: ${{ env.DEEPSEEK_API_KEY }}

      - name: Prepare for report and save base64 prompt
        id: prepare
        run: |
          echo > BENCHMARK_REPORT.md
          echo > EXECUTIVE_SUMMARY.md
          {
            echo "prompt-base64=$(base64 -w 0 < .github/prompts/request-summary.txt)"
          } >> "$GITHUB_OUTPUT"

      - name: Generate report
        id: generate-report
        uses: ./.github/actions/invoke-pi
        with:
          context-base64: ""
          prompt-base64: ${{ steps.prepare.outputs.prompt-base64 }}

      - name: Prefix preamble to report
        id: preamble
        run: |
          BENCHMARK_REPORT=$(cat BENCHMARK_REPORT.md)
          EXECUTIVE_SUMMARY=$(cat EXECUTIVE_SUMMARY.md)
          {
            echo "# Preamble"
            echo
            echo "This is an AI generated report created at $(date)."
            echo
            echo "The following was generated by DeepSeek using model 'deepseek-v4-flash'. LLMs can make mistakes so treat this as a *guide*."
            echo
            echo "${BENCHMARK_REPORT}"
          }  > BENCHMARK_REPORT.md
          {
            echo "# Preamble"
            echo
            echo "This is an AI generated summary of the full report [which can be found here](./BENCHMARK_REPORT.md)."
            echo
            echo "The following was generated by DeepSeek using model 'deepseek-v4-flash'. LLMs can make mistakes so treat this as a *guide*."
            echo
            echo "${EXECUTIVE_SUMMARY}"
          }  > EXECUTIVE_SUMMARY.md
          git config --global user.email "agent@stock-trek.com"
          git config --global user.name "Stock-Trek Agent"
          git add BENCHMARK_REPORT.md
          git add EXECUTIVE_SUMMARY.md
          git commit -m "Added AI generated summary"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        env:
          GITHUB_APP_AGENT_HELPER_CLIENT_ID: ${{ env.GITHUB_APP_AGENT_HELPER_CLIENT_ID }}
          GITHUB_APP_AGENT_HELPER_PRIVATE_KEY: ${{ env.GITHUB_APP_AGENT_HELPER_PRIVATE_KEY }}
        with:
          client-id: ${{ env.GITHUB_APP_AGENT_HELPER_CLIENT_ID }}
          private-key: ${{ env.GITHUB_APP_AGENT_HELPER_PRIVATE_KEY }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Generate summary"
          title: "Update summary"
          body: "This PR was automatically created by a GitHub Action"
          branch: summary-${{ github.run_id }}
          base: master
          token: ${{ steps.app-token.outputs.token }}
          branch-token: ${{ steps.app-token.outputs.token }}
