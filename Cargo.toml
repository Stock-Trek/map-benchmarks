[package]
name = "bench-map"
version = "1.0.0"
edition = "2024"

[dependencies]
criterion = { version = "0.8.2", features = ["async_futures", "html_reports"] }
rand = "0.10.2"
uuid = { version = "1.24.0", features = ["v4"] }
# map dependencies
ahash = "0"
archery = "1.2.2"  # pointer kind (RcK) used by rpds::HashTrieMap
concread = "0"
concurrent-map = "5"
crossbeam-skiplist = "0"
dashmap = "6"
flurry = "0"
hashbrown = "0"
hashlink = "0"
horde = "0"
immutable-chunkmap = "2"
imbl = "7"
indexmap = "2"
intmap = "3.1.3"
leapfrog = { version = "0", features = ["stable_alloc"] }
libc = "0"
papaya = "0"
rustc-hash = "2"
rpds = "1"
scc = "3"
starshard = "2"
txmap = "3"

[[bench]]
name = "clear_and_reuse"
harness = false

[[bench]]
name = "clone"
harness = false

[[bench]]
name = "contention"
harness = false

[[bench]]
name = "create"
harness = false

[[bench]]
name = "get_or_insert"
harness = false

[[bench]]
name = "get_or_insert_concurrent"
harness = false

[[bench]]
name = "growth"
harness = false

[[bench]]
name = "insert"
harness = false

[[bench]]
name = "iterate"
harness = false

[[bench]]
name = "key_sensitivity"
harness = false

[[bench]]
name = "lookup_hit"
harness = false

[[bench]]
name = "lookup_miss"
harness = false

[[bench]]
name = "remove"
harness = false

[[bench]]
name = "synchronization"
harness = false

[[bench]]
name = "throughput_concurrent"
harness = false

[[bench]]
name = "throughput_serial"
harness = false
