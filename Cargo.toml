[package]
name = "bench-map"
version = "1.0.0"
edition = "2024"

[dependencies]
criterion = { version = "0.8.2", features = ["async_futures", "html_reports"] }
rand = "0.10.2"
uuid = { version = "1.24.0", features = ["v4"] }
ahash = "0"
concread = "0"
dashmap = "6"
hashbrown = "0"
horde = "0"
immutable-chunkmap = "2"
indexmap = "2"
libc = "0"
rustc-hash = "2"
starshard = "2"
txmap = "3"

[[bench]]
name = "insert"
path = "benches/both/insert.rs"
harness = false

[[bench]]
name = "key_sensitivity"
path = "benches/out_of_the_box/key_sensitivity.rs"
harness = false

[[bench]]
name = "lookup_hit"
path = "benches/same_hasher/lookup_hit.rs"
harness = false

[[bench]]
name = "lookup_miss"
path = "benches/same_hasher/lookup_miss.rs"
harness = false

[[bench]]
name = "mixed_read_write"
path = "benches/same_hasher/mixed_read_write.rs"
harness = false

[[bench]]
name = "remove"
path = "benches/same_hasher/remove.rs"
harness = false

[[bench]]
name = "concurrency"
path = "benches/same_hasher/concurrency.rs"
harness = false

[[bench]]
name = "iterate"
path = "benches/same_hasher/iterate.rs"
harness = false

[[bench]]
name = "clone"
path = "benches/out_of_the_box/clone.rs"
harness = false

[[bench]]
name = "create"
path = "benches/out_of_the_box/create.rs"
harness = false

[[bench]]
name = "bulk_clear"
path = "benches/out_of_the_box/bulk_clear.rs"
harness = false
