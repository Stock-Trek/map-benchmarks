[package]
name = "bench-map"
version = "1.0.0"
edition = "2024"

[dependencies]
criterion = { version = "0.8.2", features = ["async_futures", "html_reports"] }
rand = "0.10.2"
uuid = { version = "1.24.0", features = ["v4"] }
# map dependencies
ahash = "0"
concread = "0"
dashmap = "6"
flurry = "0"
hashbrown = "0"
horde = "0"
immutable-chunkmap = "2"
indexmap = "2"
leapfrog = { version = "0", features = ["stable_alloc"] }
libc = "0"
papaya = "0"
rustc-hash = "2"
scc = "3"
starshard = "2"
txmap = "3"

[[bench]]
name = "bulk_clear"
harness = false

[[bench]]
name = "clone"
harness = false

[[bench]]
name = "concurrency"
harness = false

[[bench]]
name = "create"
harness = false

[[bench]]
name = "insert"
harness = false

[[bench]]
name = "iterate"
harness = false

[[bench]]
name = "key_sensitivity"
harness = false

[[bench]]
name = "lookup_hit"
harness = false

[[bench]]
name = "lookup_miss"
harness = false

[[bench]]
name = "mixed_read_write"
harness = false

[[bench]]
name = "remove"
harness = false
